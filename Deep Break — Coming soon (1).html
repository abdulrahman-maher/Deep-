<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Deep Break — Coming soon</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#fbfbfa;--fg:#0d0d0d;--mut:#6e6e73;--line:rgba(0,0,0,.12);--card:rgba(255,255,255,.7);--btn:#0d0d0d;--btnt:#fff;--glow:.55;
--f:'Inter',system-ui,-apple-system,'Segoe UI',sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a;--fg:#f4f4f2;--mut:#9a9aa0;--line:rgba(255,255,255,.14);--card:rgba(20,20,20,.7);--btn:#f4f4f2;--btnt:#0a0a0a;--glow:.8}}
:root[data-theme="dark"]{--bg:#0a0a0a;--fg:#f4f4f2;--mut:#9a9aa0;--line:rgba(255,255,255,.14);--card:rgba(20,20,20,.7);--btn:#f4f4f2;--btnt:#0a0a0a;--glow:.8}
*{box-sizing:border-box;margin:0}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{min-height:100%;background:var(--bg);color:var(--fg);font-family:var(--f);-webkit-font-smoothing:antialiased;overflow-x:hidden;
padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}
.bg{position:fixed;inset:0;pointer-events:none;background:radial-gradient(60% 50% at 50% 38%,rgba(255,70,50,calc(var(--glow)*.18)),transparent 70%);animation:bgp 8s ease-in-out infinite alternate}
@keyframes bgp{to{opacity:.55;transform:scale(1.08)}}
.wrap{position:relative;min-height:100svh;display:flex;flex-direction:column;align-items:center;padding:20px 20px 28px}
header{width:100%;max-width:1100px;display:flex;justify-content:space-between;align-items:center;font-size:15px;font-weight:500;opacity:0;animation:fade .9s ease-out 2.6s forwards}
.mark{display:flex;align-items:center;gap:10px;letter-spacing:-.01em}
.mark i{width:18px;height:18px;border-radius:50%;background:conic-gradient(#ff2a2a,#ff9a6b,#ff4d8d,#c40000,#ff2a2a);animation:spin 6s linear infinite}
.pill{display:flex;align-items:center;gap:8px;padding:7px 14px;border:1px solid var(--line);border-radius:99px;background:var(--card);backdrop-filter:blur(10px);font-size:13px;color:var(--mut)}
.pill b{width:7px;height:7px;border-radius:50%;background:#ff3b30;animation:pulse 1.6s ease-out infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(255,59,48,.6)}100%{box-shadow:0 0 0 10px rgba(255,59,48,0)}}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;width:100%;max-width:640px;gap:clamp(14px,2.6vh,26px)}
/* orb */
.orb{--s:clamp(150px,30vmin,300px);position:relative;width:var(--s);height:var(--s);transform:translate(var(--ox,0),var(--oy,0));transition:transform .5s cubic-bezier(.2,.8,.2,1);opacity:0;animation:orbin 1.6s cubic-bezier(.16,1,.3,1) .2s forwards}
@keyframes orbin{from{opacity:0;scale:.5;filter:blur(30px)}to{opacity:1;scale:1;filter:none}}
.orb .sph{position:absolute;inset:0;border-radius:50%;overflow:hidden;animation:breathe 5s ease-in-out infinite;box-shadow:0 30px 80px -20px rgba(255,50,30,calc(var(--glow)*.7)),inset 0 -14px 40px rgba(120,0,0,.35)}
@keyframes breathe{50%{scale:1.05}}
.sph .c{position:absolute;inset:-30%;background:conic-gradient(from 0deg,#ff2a2a,#ff9a6b,#ffe2d2,#ff4d8d,#b30000,#ff6a3d,#ff2a2a);animation:spin 9s linear infinite;filter:blur(18px)}
@keyframes spin{to{rotate:360deg}}
.sph .b{position:absolute;width:60%;height:60%;border-radius:50%;filter:blur(22px);mix-blend-mode:screen}
.sph .b1{background:#ffb199;left:5%;top:5%;animation:m1 7s ease-in-out infinite alternate}
.sph .b2{background:#ff1f4b;right:0;bottom:0;animation:m2 6s ease-in-out infinite alternate}
@keyframes m1{to{translate:60% 40%}}@keyframes m2{to{translate:-70% -50%}}
.sph .h{position:absolute;inset:0;background:radial-gradient(circle at calc(32% + var(--hx,0%)) calc(26% + var(--hy,0%)),rgba(255,255,255,.85),transparent 38%)}
.rg{position:absolute;inset:0;border-radius:50%;border:1px solid var(--line);opacity:0;animation:rip 4.5s ease-out infinite}
.rg:nth-child(2){animation-delay:1.5s}.rg:nth-child(3){animation-delay:3s}
@keyframes rip{0%{scale:1;opacity:.9}100%{scale:2.3;opacity:0}}
/* type */
h1{font-size:clamp(52px,11vw,112px);font-weight:600;letter-spacing:-.055em;line-height:.95}
h1 .ch{display:inline-block;opacity:0;animation:rise 1s cubic-bezier(.16,1,.3,1) calc(1s + var(--i)*.055s) forwards}
h1 .sp{display:inline-block;width:.25em}
@keyframes rise{from{opacity:0;transform:translateY(55%);filter:blur(14px)}to{opacity:1;transform:none;filter:none}}
.sub{font-size:clamp(18px,2.2vw,24px);font-weight:500;letter-spacing:-.02em;color:transparent;background:linear-gradient(100deg,var(--mut) 40%,var(--fg) 50%,var(--mut) 60%) 100% 0/250% 100%;-webkit-background-clip:text;background-clip:text;opacity:0;animation:fade .9s ease-out 2s forwards,sheen 4.5s ease-in-out 3s infinite}
@keyframes sheen{0%{background-position:100% 0}60%,100%{background-position:0 0}}
@keyframes fade{to{opacity:1}}
.cd{display:flex;gap:10px;opacity:0;animation:up .9s cubic-bezier(.16,1,.3,1) 2.3s forwards}
.cd div{min-width:68px;padding:12px 8px 10px;border:1px solid var(--line);border-radius:16px;background:var(--card);backdrop-filter:blur(10px);overflow:hidden}
.cd b{display:block;font-size:clamp(26px,5vw,36px);font-weight:600;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.1}
.cd b.t{animation:roll .4s cubic-bezier(.2,.9,.3,1.2)}
@keyframes roll{from{transform:translateY(-60%);opacity:0}to{transform:none;opacity:1}}
.cd small{font-size:12px;color:var(--mut)}
@keyframes up{from{opacity:0;transform:translateY(22px)}to{opacity:1;transform:none}}
form{display:flex;width:100%;max-width:440px;padding:6px;border:1px solid var(--line);border-radius:99px;background:var(--card);backdrop-filter:blur(10px);opacity:0;animation:up .9s cubic-bezier(.16,1,.3,1) 2.5s forwards;transition:box-shadow .3s,border-color .3s}
form:focus-within{border-color:var(--fg);box-shadow:0 0 0 4px rgba(255,59,48,.15)}
input{flex:1;min-width:0;border:0;background:none;color:var(--fg);font:400 16px var(--f);padding:0 16px;outline:0}
input::placeholder{color:var(--mut)}
button{border:0;border-radius:99px;padding:13px 22px;background:var(--btn);color:var(--btnt);font:500 15px var(--f);cursor:pointer;transition:transform .2s,background .3s}
button:hover{transform:scale(1.04)}button:active{transform:scale(.95)}
button:focus-visible{outline:2px solid #ff3b30;outline-offset:2px}
form.ok button{background:#1f9d55;color:#fff}form.sh{animation:shk .4s}
@keyframes shk{25%{transform:translateX(-8px)}75%{transform:translateX(8px)}}
footer{font-size:13px;color:var(--mut);opacity:0;animation:fade .9s ease-out 2.8s forwards}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;animation-delay:0s!important;animation-iteration-count:1!important}}
</style></head>
<body><div class="bg"></div>
<div class="wrap">
<header><span class="mark"><i></i>Deep Break</span><span class="pill"><b></b>Under construction</span></header>
<main>
 <div class="orb" id="orb"><i class="rg"></i><i class="rg"></i><i class="rg"></i>
  <div class="sph"><div class="c"></div><div class="b b1"></div><div class="b b2"></div><div class="h"></div></div></div>
 <h1 id="h" aria-label="Deep Break">Deep Break</h1>
 <p class="sub">You’re not ready.</p>
 <div class="cd" id="cd"><div><b>00</b><small>Days</small></div><div><b>00</b><small>Hours</small></div><div><b>00</b><small>Min</small></div><div><b>00</b><small>Sec</small></div></div>
 <form id="f" novalidate><input id="e" type="email" placeholder="Email address" aria-label="Email address" autocomplete="email"><button id="b" type="submit">Notify me</button></form>
</main>
<footer>© 2026 Deep Break</footer>
</div>
<script>
(function(){
var h=document.getElementById('h'),t=h.textContent;h.textContent='';
t.split('').forEach(function(c,i){var s=document.createElement('span');s.setAttribute('aria-hidden','true');s.className=c===' '?'sp':'ch';if(c!==' ')s.textContent=c;s.style.setProperty('--i',i);h.appendChild(s)});
var T=new Date('2026-11-30T00:00:00').getTime(),b=document.getElementById('cd').querySelectorAll('b'),L=[];
function cd(){var d=Math.max(0,T-Date.now())/1000,v=[Math.floor(d/86400),Math.floor(d%86400/3600),Math.floor(d%3600/60),Math.floor(d%60)];
v.forEach(function(x,i){var s=('0'+x).slice(-2);if(L[i]!==s){b[i].textContent=s;if(L[i]){b[i].classList.remove('t');void b[i].offsetWidth;b[i].classList.add('t')}L[i]=s}})}
cd();setInterval(cd,1000);
var o=document.getElementById('orb');
addEventListener('pointermove',function(e){var x=e.clientX/innerWidth-.5,y=e.clientY/innerHeight-.5;
o.style.setProperty('--ox',x*28+'px');o.style.setProperty('--oy',y*20+'px');o.style.setProperty('--hx',x*30+'%');o.style.setProperty('--hy',y*30+'%')});
function mail(v){var a=document.createElement('a');a.href='mailto:a.m404.al@gmail.com?subject='+encodeURIComponent('Deep Break - new signup')+'&body='+encodeURIComponent('Please notify me at launch: '+v);a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();a.remove()}
var f=document.getElementById('f');f.addEventListener('submit',function(e){e.preventDefault();var e1=document.getElementById('e');
if(!/^\S+@\S+\.\S+$/.test(e1.value.trim())){f.classList.remove('sh');void f.offsetWidth;f.classList.add('sh');e1.focus();return}
mail(e1.value.trim());f.classList.add('ok');document.getElementById('b').textContent='You’re on the list';e1.value='';e1.placeholder='We’ll email you at launch'});
})();
</script></body></html>
